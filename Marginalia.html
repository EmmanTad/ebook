<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
</head>

<body>
  <title>Marginalia</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=DM+Mono:wght@400;500&display=swap">
  <style>
    /* Layout: a shelf of animated book covers, then a two-column reader (sticky live scene + chapter list | page of text).
   Each topic brings its own accent through --topic; the app chrome stays cool and neutral. */
    :root {
      --bg: #E8ECEF;
      --surface: #F4F7F8;
      --paper: #FBFCFC;
      --fg: #11161C;
      --muted: #505B66;
      --line: #C8D0D7;
      --accent: #0A6C97;
      --accent-fg: #FFFFFF;
      --font-display: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'Literata', Georgia, 'Times New Roman', serif;
      --font-mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;
      --fs: 1.125;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0D1217;
        --surface: #151C23;
        --paper: #111920;
        --fg: #E7ECF0;
        --muted: #98A4AF;
        --line: #27313A;
        --accent: #6CC3EA;
        --accent-fg: #06222F;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0D1217;
      --surface: #151C23;
      --paper: #111920;
      --fg: #E7ECF0;
      --muted: #98A4AF;
      --line: #27313A;
      --accent: #6CC3EA;
      --accent-fg: #06222F;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-display);
      font-size: 15px;
      line-height: 1.5;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 0 56px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--bg);
      z-index: 10
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto
    }

    a {
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px
    }

    .top {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-block: 14px;
      border-bottom: 1px solid var(--line)
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -.01em
    }

    .brand svg {
      width: 26px;
      height: 26px;
      color: var(--accent)
    }

    .btn {
      font: 600 .85rem/1 var(--font-display);
      color: var(--fg);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px
    }

    .btn:hover {
      border-color: var(--fg)
    }

    .btn.primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent)
    }

    .eyebrow {
      font: 500 .72rem/1.2 var(--font-mono);
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0
    }

    /* Library */
    .intro {
      display: grid;
      gap: 20px;
      padding-block: 40px 8px
    }

    .intro h1 {
      margin: 0;
      font-weight: 800;
      font-size: clamp(2.1rem, 5.6vw, 4rem);
      line-height: 1.02;
      letter-spacing: -.03em;
      text-wrap: balance;
      max-width: 14ch
    }

    .lede {
      margin: 0;
      font: 400 1.05rem/1.6 var(--font-body);
      color: var(--muted);
      max-width: 46ch
    }

    @media (min-width:820px) {
      .intro {
        grid-template-columns: 1.3fr 1fr;
        align-items: end;
        gap: 48px
      }
    }

    .shelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr));
      gap: 22px;
      margin-top: 32px
    }

    .cover {
      position: relative;
      display: block;
      aspect-ratio: 3/4;
      max-width: 100%;
      border-radius: 3px 12px 12px 3px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      background: #050816;
      isolation: isolate;
      transition: transform .25s ease, box-shadow .25s ease
    }

    .cover:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 30px -14px rgba(0, 0, 0, .5)
    }

    .cover canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(0, 0, 0, .4), rgba(255, 255, 255, .14) 3.5%, rgba(0, 0, 0, .12) 5.5%, transparent 9%)
    }

    .shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(to top, rgba(3, 6, 14, .9) 0%, rgba(3, 6, 14, .55) 30%, transparent 56%)
    }

    .meta {
      position: absolute;
      z-index: 2;
      left: 20px;
      right: 14px;
      bottom: 14px;
      display: grid;
      gap: 6px
    }

    .tag {
      font: 500 .66rem/1 var(--font-mono);
      letter-spacing: .1em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, .85)
    }

    .tag::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--topic)
    }

    .ctitle {
      font-weight: 700;
      font-size: 1.25rem;
      line-height: 1.08;
      letter-spacing: -.01em;
      text-wrap: balance
    }

    .sub {
      font: 400 .72rem/1.2 var(--font-mono);
      color: rgba(255, 255, 255, .7)
    }

    .bar {
      display: block;
      height: 3px;
      background: rgba(255, 255, 255, .25);
      margin-top: 4px
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--topic)
    }

    .cover.add {
      background: transparent;
      border: 1.5px dashed var(--line);
      color: var(--fg);
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: 12px
    }

    .cover.add::after {
      display: none
    }

    .cover.add:hover {
      border-color: var(--accent);
      box-shadow: none
    }

    .add-in {
      display: grid;
      gap: 8px;
      justify-items: center;
      padding: 16px
    }

    .add-in b {
      font-size: 2rem;
      line-height: 1;
      font-weight: 400;
      color: var(--accent)
    }

    .add-in span {
      font-weight: 700;
      font-size: 1.05rem
    }

    .add-in small {
      font: 400 .72rem/1.3 var(--font-mono);
      color: var(--muted)
    }

    /* Reader */
    .reader-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-block: 18px
    }

    .tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .reader-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 24px
    }

    .scene {
      margin: 0;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #050816;
      aspect-ratio: 16/11;
      max-width: 100%
    }

    .scene canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    .cap {
      font: 400 .74rem/1.45 var(--font-mono);
      color: var(--muted);
      margin: 10px 2px 0
    }

    .toc {
      display: grid;
      gap: 4px;
      margin-top: 14px
    }

    .toc button {
      font: inherit;
      color: var(--fg);
      background: transparent;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      text-align: left;
      cursor: pointer;
      min-height: 44px
    }

    .toc button:hover {
      background: var(--surface)
    }

    .toc button[aria-current="true"] {
      background: var(--surface);
      font-weight: 700
    }

    .toc .n {
      font: 500 .72rem/1 var(--font-mono);
      color: var(--muted)
    }

    .toc .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1.5px solid var(--line)
    }

    .toc .dot.on {
      background: var(--topic);
      border-color: var(--topic)
    }

    .page {
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px 14px 14px 4px;
      padding: clamp(22px, 4.5vw, 52px)
    }

    .sheet {
      max-width: 64ch;
      animation: turn .45s cubic-bezier(.2, .7, .2, 1)
    }

    @keyframes turn {
      from {
        opacity: .3;
        transform: translateX(var(--dx, 18px))
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .segs {
      display: flex;
      gap: 6px;
      margin-bottom: 26px
    }

    .seg {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--line)
    }

    .seg.seen {
      background: color-mix(in srgb, var(--topic) 45%, var(--line))
    }

    .seg.cur {
      background: var(--topic)
    }

    .sheet h2 {
      margin: 10px 0 22px;
      font-weight: 800;
      font-size: clamp(1.8rem, 4.2vw, 2.7rem);
      line-height: 1.05;
      letter-spacing: -.025em;
      text-wrap: balance
    }

    .sheet p {
      font-family: var(--font-body);
      font-size: calc(var(--fs)*1rem);
      line-height: 1.72;
      margin: 0 0 1.1em
    }

    .sheet p.eyebrow {
      font-family: var(--font-mono);
      font-size: .72rem;
      line-height: 1.2;
      margin: 0
    }

    .fact {
      margin: 30px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 6px
    }

    .fact dt {
      font: 500 .72rem/1.2 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .fact dt::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--topic)
    }

    .fact dd {
      margin: 0;
      font-weight: 700;
      font-size: clamp(1.3rem, 3vw, 1.7rem);
      letter-spacing: -.01em;
      line-height: 1.2
    }

    .pager {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 34px;
      flex-wrap: wrap
    }

    .pager .btn {
      display: grid;
      gap: 4px;
      padding: 12px 16px;
      min-width: 0;
      max-width: 100%;
      flex: 1 1 180px
    }

    .pager .btn small {
      font: 400 .68rem/1 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .pager .btn span {
      font-weight: 700;
      line-height: 1.2
    }

    .pager .nx {
      text-align: right
    }

    .pager .ph {
      flex: 1 1 180px
    }

    @media (min-width:920px) {
      .reader-grid {
        grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
        gap: 48px;
        align-items: start
      }

      .side {
        position: sticky;
        top: calc(env(safe-area-inset-top, 0px) + 76px)
      }

      .side .scene {
        aspect-ratio: 1/1
      }
    }

    /* Composer */
    .compose {
      max-width: 760px;
      padding-block: 32px;
      display: grid;
      gap: 22px
    }

    .compose h1 {
      margin: 0;
      font-weight: 800;
      font-size: clamp(1.9rem, 4.5vw, 3rem);
      letter-spacing: -.03em;
      line-height: 1.05
    }

    .field {
      display: grid;
      gap: 8px
    }

    .field label,
    .field legend {
      font: 500 .72rem/1.2 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0
    }

    fieldset {
      border: 0;
      margin: 0;
      padding: 0;
      min-width: 0
    }

    input[type=text],
    textarea {
      font: inherit;
      color: var(--fg);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      width: 100%;
      min-width: 0
    }

    textarea {
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.6;
      min-height: 240px;
      resize: vertical
    }

    .picker {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px
    }

    .opt {
      position: relative;
      display: block
    }

    .opt input {
      position: absolute;
      opacity: 0;
      inset: 0;
      margin: 0;
      cursor: pointer
    }

    .opt span {
      display: block;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      font-weight: 600;
      font-size: .9rem
    }

    .opt input:checked+span {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent)
    }

    .opt input:focus-visible+span {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    .hint {
      font: 400 .78rem/1.5 var(--font-mono);
      color: var(--muted);
      margin: 0
    }

    .err {
      margin: 0;
      color: #B3261E;
      font-weight: 600
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .err {
        color: #FF9B93
      }
    }

    :root[data-theme="dark"] .err {
      color: #FF9B93
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }


    /* Business series: its own look (bold typographic covers, hero card, callouts) */
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line) }
    .section-head h2 { margin: 0; font-weight: 800; font-size: clamp(1.5rem, 3.4vw, 2.2rem); letter-spacing: -.02em }
    .section-head p { margin: 0; font: 400 .95rem/1.5 var(--font-body); color: var(--muted); max-width: 46ch }
    .cover.biz { background: var(--bz); border-radius: 4px 16px 16px 4px }
    .bz-art { position: absolute; inset: 0; z-index: 0;
      background:
        radial-gradient(circle at 88% 16%, color-mix(in srgb, var(--pop) 30%, transparent) 0 20%, transparent 21%),
        radial-gradient(circle at 88% 16%, transparent 0 27%, color-mix(in srgb, var(--pop) 45%, transparent) 27.6% 28.6%, transparent 29.2%),
        repeating-linear-gradient(135deg, transparent 0 16px, rgba(255, 255, 255, .05) 16px 17px),
        linear-gradient(to top, rgba(0, 0, 0, .35), transparent 60%) }
    .bz-num { position: absolute; z-index: 1; top: 12px; left: 22px; font: 800 4.4rem/1 var(--font-display); letter-spacing: -.05em; color: var(--pop); transition: transform .3s ease }
    .cover.biz:hover .bz-num { transform: translateY(3px) scale(1.04) }
    .cover.biz .ctitle { font-weight: 800; font-size: 1.3rem; line-height: 1.06 }
    .cover.biz .tag { justify-self: start; color: var(--bz); background: var(--pop); padding: 5px 9px; border-radius: 999px; font-weight: 500 }
    .cover.biz .tag::before { display: none }
    .cover.biz .bar i { background: var(--pop) }

    .hero { position: relative; overflow: hidden; isolation: isolate; background: var(--bz); color: #fff; border-radius: 16px; padding: 24px 22px 20px; min-height: 250px; display: grid; gap: 10px; align-content: end }
    .hero::before { content: ""; position: absolute; z-index: -1; right: -70px; top: -70px; width: 240px; height: 240px; border-radius: 50%; border: 36px solid color-mix(in srgb, var(--pop) 32%, transparent) }
    .hero::after { content: ""; position: absolute; z-index: -1; inset: 0; background: repeating-linear-gradient(135deg, transparent 0 16px, rgba(255, 255, 255, .045) 16px 17px) }
    .hero-no { position: absolute; top: 14px; left: 22px; font: 800 4.2rem/1 var(--font-display); letter-spacing: -.05em; color: var(--pop) }
    .hero-tag { justify-self: start; font: 500 .66rem/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--bz); background: var(--pop); padding: 5px 9px; border-radius: 999px }
    .hero-title { margin: 0; font: 800 clamp(1.5rem, 3vw, 1.95rem)/1.08 var(--font-display); letter-spacing: -.02em; text-wrap: balance }
    .hero-cap { margin: 0; font: 400 .76rem/1.45 var(--font-mono); color: rgba(255, 255, 255, .78) }
    .hero-bar { display: block; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .22); margin-top: 4px }
    .hero-bar i { display: block; height: 100%; border-radius: 2px; background: var(--pop); transition: width .4s ease }

    .reader.biz .page { border-radius: 16px; border-top: 6px solid var(--topic) }
    .step { display: block; font: 800 clamp(3.4rem, 9vw, 5.6rem)/.9 var(--font-display); letter-spacing: -.05em; margin: 0 0 10px; color: color-mix(in srgb, var(--topic) 70%, var(--paper)) }
    .reader.biz .sheet h2 { margin-top: 4px }
    .reader.biz .fact { background: var(--bz); color: #fff; border: 0; border-left: 6px solid var(--pop); border-radius: 12px; padding: 18px 20px }
    .reader.biz .fact dt { color: var(--pop) }
    .reader.biz .fact dt::before { content: "\2192"; width: auto; height: auto; background: none; border-radius: 0 }
    .reader.biz .toc button { border: 1px solid var(--line); background: var(--surface) }
    .reader.biz .toc { gap: 6px }
    .reader.biz .toc button[aria-current="true"] { background: var(--bz); border-color: var(--bz); color: #fff }
    .reader.biz .toc button[aria-current="true"] .n { color: var(--pop) }
    .reader.biz .toc button[aria-current="true"] .dot { border-color: var(--pop) }
    .reader.biz .pager .nx { background: var(--bz); border-color: var(--bz); color: #fff }
    .reader.biz .pager .nx small { color: var(--pop) }
    @media (min-width: 920px) { .hero { min-height: 340px } }

    /* Print / download */
    #print-area { display: none }
    @media print {
      @page { margin: 18mm }
      body { background: #fff !important; color: #000 !important; padding: 0 !important }
      body::before, .wrap, .top { display: none !important }
      #print-area { display: block !important; font-family: var(--font-body); font-size: 11.5pt; line-height: 1.55; color: #000 }
      #print-area h1 { font: 800 26pt/1.15 var(--font-display); margin: 0 0 4pt }
      #print-area .pa-tag { font: 500 9pt var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: #555; margin: 0 0 18pt }
      #print-area section { break-inside: avoid-page; margin-bottom: 20pt }
      #print-area h2 { font: 700 16pt/1.25 var(--font-display); margin: 0 0 6pt; break-after: avoid }
      #print-area p { margin: 0 0 8pt }
      #print-area .pa-fact { border-left: 3pt solid #888; padding-left: 8pt; margin: 8pt 0 0; font-size: 10.5pt }
    }
  </style>

  <div class="wrap">
    <header class="top">
      <a class="brand" href="#" aria-label="Marginalia library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M3 5.5c3-1.2 6-1 9 .8 3-1.8 6-2 9-.8V19c-3-1.2-6-1-9 .8-3-1.8-6-2-9-.8z" />
          <path d="M12 6.3v13.5" />
        </svg>
        Marginalia
      </a>
      <button class="btn" id="theme" type="button"></button>
    </header>
    <main id="view"></main>
  </div>

  <script>

        id: "first-10-clients", design: "biz", no: "04", bg: "#8A2D0F", pop: "#FFD166", scene: "neural", title: "How to Get Your First 10 Clients Online", tag: "Marketing", accent: "#FFD166", chapters: [
          {
            title: "Know who you are looking for", cap: "Every connection starts with one person",
            body: ["Before you look for clients, describe the exact person who needs you: their job, their problem and where they spend time online. The clearer the picture, the easier it is to find them and to speak to them.",
              "Then write one sentence that says what you do for them. If a stranger cannot repeat it back, simplify it."],
            fig: { k: "Your one-liner", v: "I help [who] get [result]" }
          },
          {
            title: "Start with your own network", cap: "Warm contacts connect you to more",
            body: ["Your first clients often come from people who already know you: friends, former coworkers, classmates and family. Message them directly, say what you now offer and ask if they know someone who could use it.",
              "Be specific and polite. Instead of asking for a favor, describe a clear way you can help. A personal message gets far more replies than a general post."],
            fig: { k: "Easiest first sale", v: "someone who already trusts you" }
          },
          {
            title: "Show up where clients already are", cap: "Go where your buyers gather",
            body: ["Join the groups, communities and platforms your ideal clients use, such as professional networks, forums and social media groups. Answer questions helpfully and share useful tips before you ever mention your service.",
              "Post short examples of your work and the results you achieved. Consistent, helpful posting makes people remember you when they are ready to hire."],
            fig: { k: "Golden rule", v: "help first, pitch second" }
          },
          {
            title: "Reach out and follow up", cap: "Each message strengthens the network",
            body: ["Send a short, personal message to potential clients. Mention something specific about their business, point out one problem you can solve and suggest a simple next step, such as a quick call.",
              "Most sales happen after a follow-up, not the first message. Send a polite reminder a few days later. When you finish a job, ask for a testimonial and a referral, which are often your fastest route to client number ten."],
            fig: { k: "Daily habit", v: "a few personal messages every day" }
          }
        ]
      },
      {
        id: "freelancer-to-owner", design: "biz", no: "05", bg: "#141414", pop: "#C6F432", scene: "sound", title: "From Freelancer to Business Owner: A Complete Guide", tag: "Business", accent: "#C6F432", chapters: [
          {
            title: "Change how you think", cap: "A small signal grows into a bigger one",
            body: ["A freelancer sells hours. A business owner builds something that can earn without every hour of their own work. The change starts in your mindset: you stop asking “how do I get the next job?” and start asking “how do I build a business that can grow?”",
              "You are still the main worker for now, but you begin to plan, measure and improve like an owner."],
            fig: { k: "The shift", v: "from selling hours to building a system" }
          },
          {
            title: "Set up the business properly", cap: "Make your signal clear and official",
            body: ["Choose a business name, register it according to the rules where you live and open a separate bank or e-wallet account for business money. Keeping personal and business funds apart makes tax time and planning much easier.",
              "Use written agreements with clients, with clear scope, price, deadlines and payment terms. Check local requirements for permits and taxes, and ask a professional if you are unsure."],
            fig: { k: "Foundation", v: "name, registration, separate account, contracts" }
          },
          {
            title: "Productize and raise your prices", cap: "Amplify what already works",
            body: ["Turn your most requested work into a clear package with a fixed scope and price. Packages are easier to sell, easier to deliver and easier to explain than custom quotes.",
              "As your skill and demand grow, raise your rates. If almost every prospect says yes without hesitation, you are probably charging too little."],
            fig: { k: "Better than hourly", v: "fixed packages with a fixed outcome" }
          },
          {
            title: "Delegate and scale", cap: "More voices, a wider reach",
            body: ["You cannot grow if you do every task yourself. Start by handing off small, repeatable jobs such as admin, editing or scheduling to a part-time helper or subcontractor. Give clear instructions and a checklist.",
              "Use the time you free up for the work only you can do: finding clients, improving the offer and planning. That is how a freelancer becomes the owner of a business that keeps running and growing."],
            fig: { k: "Owner’s job", v: "find clients, improve the offer, plan ahead" }
          }
        ]
      }
    ];

    /* ---------- state ---------- */
    const KEY = "marginalia-v1";
    const store = { ch: {}, seen: {}, fs: 1.125, theme: null, custom: [] };
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && typeof p === "object") {
          if (p.ch && typeof p.ch === "object") store.ch = p.ch;
          if (p.seen && typeof p.seen === "object") store.seen = p.seen;
          if (typeof p.fs === "number") store.fs = clamp(p.fs, .95, 1.5);
          if (p.theme === "light" || p.theme === "dark") store.theme = p.theme;
          if (Array.isArray(p.custom)) store.custom = p.custom.filter(b => b && typeof b.id === "string" && SCENES[b.scene] && Array.isArray(b.chapters) && b.chapters.length);
        }
      }
    } catch (e) { }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { } }
    const all = () => [...BOOKS, ...store.custom];
    const words = b => b.chapters.reduce((n, c) => n + c.body.join(" ").split(/\s+/).length, 0);
    const mins = b => Math.max(1, Math.round(words(b) / 200));
    let active = null;

    /* ---------- theme ---------- */
    const themeBtn = $("#theme");
    const effective = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    function paintTheme() { themeBtn.textContent = effective() === "dark" ? "Light mode" : "Dark mode"; }
    if (store.theme) document.documentElement.dataset.theme = store.theme;
    themeBtn.addEventListener("click", () => {
      const next = effective() === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next; store.theme = next; save(); paintTheme();
    });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintTheme);
    paintTheme();

    /* ---------- views ---------- */
    const view = $("#view");

    function cover(b) {
      const seen = store.seen[b.id] || [];
      const pct = b.chapters.filter((_, i) => seen[i] === true).length / b.chapters.length * 100;
      const biz = b.design === "biz";
      const cv = biz ? null : h("canvas", { "aria-hidden": "true" });
      const a = h("a", { class: "cover" + (biz ? " biz" : ""), href: "#" + b.id, style: "--topic:" + b.accent + (biz ? ";--bz:" + b.bg + ";--pop:" + b.pop : ""), "aria-label": b.title + ", " + b.chapters.length + " chapters" },
        biz ? [h("span", { class: "bz-art", "aria-hidden": "true" }), h("span", { class: "bz-num", "aria-hidden": "true" }, b.no)] : [cv, h("span", { class: "shade" })],
        h("span", { class: "meta" },
          h("span", { class: "tag" }, b.tag),
          h("span", { class: "ctitle" }, b.title),
          h("span", { class: "sub" }, b.chapters.length + " chapters · " + mins(b) + " min"),
          h("span", { class: "bar" }, h("i", { style: "width:" + pct + "%" }))));
      if (biz) return a;
      const st = new Stage(cv, b.scene, 0); let n = 0;
      a.addEventListener("pointerenter", () => { n = (n + 1) % 3; st.go(n); });
      return a;
    }

    function library() {
      const books = all();
      const sci = books.filter(b => b.design !== "biz"), biz = books.filter(b => b.design === "biz");
      view.replaceChildren(
        h("section", { class: "intro" },
          h("div", null,
            h("p", { class: "eyebrow", style: "margin-bottom:14px" }, "Library · " + books.length + " books"),
            h("h1", null, "Pick a topic. Watch it move.")),
          h("p", { class: "lede" }, "Short illustrated books. Every science topic has its own live animation, and it changes as you turn the chapter. Add a book of your own at the end of the first shelf.")),
        h("div", { class: "shelf" }, sci.map(cover),
          h("a", { class: "cover add", href: "#new-book" }, h("span", { class: "add-in" }, h("b", null, "+"), h("span", null, "Write your own"), h("small", null, "Pick an animation, add chapters")))),
        biz.length ? h("div", { class: "section-head" }, h("h2", null, "Business series"), h("p", null, "Practical guides for starting and growing an online business. You can print or download each one.")) : null,
        biz.length ? h("div", { class: "shelf" }, biz.map(cover)) : null);
    }

    function reader(b) {
      let idx = Math.min(Math.max(0, store.ch[b.id] | 0), b.chapters.length - 1);
      if (!Array.isArray(store.seen[b.id])) store.seen[b.id] = [];
      store.seen[b.id][idx] = true;
      const cv = h("canvas", { "aria-hidden": "true" });
      const cap = h("figcaption", { class: "cap" });
      const toc = h("nav", { class: "toc", "aria-label": "Chapters" });
      const page = h("article", { class: "page" });
      const biz = b.design === "biz";
      const stage = biz ? { go() { } } : new Stage(cv, b.scene, idx % 3);
      const hero = biz ? h("div", { class: "hero" },
        h("span", { class: "hero-no", "aria-hidden": "true" }, b.no), h("span", { class: "hero-tag" }, b.tag),
        h("h1", { class: "hero-title" }, b.title), h("p", { class: "hero-cap" }), h("span", { class: "hero-bar", "aria-hidden": "true" }, h("i"))) : null;
      const sceneName = (SCENE_LIST.find(s => s[0] === b.scene) || [])[1] || "Animation";
      const root = h("div", { class: "reader" + (biz ? " biz" : ""), style: "--topic:" + b.accent + ";--fs:" + store.fs + (biz ? ";--bz:" + b.bg + ";--pop:" + b.pop : "") });

      function show(i, dir) {
        if (i < 0 || i >= b.chapters.length) return;
        idx = i; store.ch[b.id] = i; store.seen[b.id][i] = true; save(); stage.go(i); build(dir);
      }
      function build(dir) {
        const ch = b.chapters[idx], seen = store.seen[b.id], n = b.chapters.length, last = idx === n - 1;
        cap.textContent = ch.cap || sceneName;
        if (biz) { hero.querySelector(".hero-cap").textContent = ch.cap || ""; hero.querySelector(".hero-bar i").style.width = ((idx + 1) / n * 100) + "%"; }
        toc.replaceChildren(...b.chapters.map((c, i) => h("button", { type: "button", "aria-current": i === idx ? "true" : null, onclick: () => show(i, i > idx ? 1 : -1) },
          h("span", { class: "n" }, String(i + 1).padStart(2, "0")), h("span", null, c.title), h("span", { class: "dot" + (seen[i] === true ? " on" : "") }))));
        const sheet = h("div", { class: "sheet", style: "--dx:" + (dir * 22) + "px" },
          h("div", { class: "segs", "aria-hidden": "true" }, b.chapters.map((_, i) => h("span", { class: "seg" + (i === idx ? " cur" : seen[i] === true ? " seen" : "") }))),
          biz ? h("span", { class: "step", "aria-hidden": "true" }, String(idx + 1).padStart(2, "0")) : null,
          h("p", { class: "eyebrow" }, "Chapter " + (idx + 1) + " of " + n),
          h("h2", null, ch.title),
          ch.body.map(p => h("p", null, p)),
          ch.fig ? h("dl", { class: "fact" }, h("dt", null, ch.fig.k), h("dd", null, ch.fig.v)) : null,
          h("div", { class: "pager" },
            idx > 0 ? h("button", { class: "btn", type: "button", onclick: () => show(idx - 1, -1) }, h("small", null, "Previous"), h("span", null, b.chapters[idx - 1].title)) : h("span", { class: "ph" }),
            last ? h("a", { class: "btn nx", href: "#" }, h("small", null, "Finished"), h("span", null, "Back to library"))
              : h("button", { class: "btn nx", type: "button", onclick: () => show(idx + 1, 1) }, h("small", null, "Next"), h("span", null, b.chapters[idx + 1].title))));
        page.replaceChildren(sheet);
        const top = page.getBoundingClientRect().top;
        if (dir && top < 0) window.scrollBy({ top: top - 80, behavior: reduce ? "auto" : "smooth" });
      }
      function fontStep(d) { store.fs = clamp(Math.round((store.fs + d) * 1000) / 1000, .95, 1.5); root.style.setProperty("--fs", store.fs); save(); }

      let armed = false, timer = 0;
      const del = b.custom ? h("button", {
        class: "btn", type: "button", onclick: () => {
          if (!armed) { armed = true; del.textContent = "Confirm delete"; timer = setTimeout(() => { armed = false; del.textContent = "Delete book"; }, 4000); return; }
          clearTimeout(timer);
          store.custom = store.custom.filter(x => x.id !== b.id); delete store.ch[b.id]; delete store.seen[b.id]; save(); location.hash = "";
        }
      }, "Delete book") : null;

      root.append(
        h("div", { class: "reader-bar" },
          h("a", { class: "btn", href: "#" }, "← Library"),
          h("div", { class: "tools" }, del,
            h("button", { class: "btn", type: "button", onclick: () => printBook(b) }, "Print / PDF"),
            h("button", { class: "btn", type: "button", onclick: () => downloadBook(b).html() }, "Download"),
            h("button", { class: "btn", type: "button", "aria-label": "Smaller text", onclick: () => fontStep(-.075) }, "A−"),
            h("button", { class: "btn", type: "button", "aria-label": "Larger text", onclick: () => fontStep(.075) }, "A+"))),
        h("div", { class: "reader-grid" },
          h("aside", { class: "side" },
            biz ? hero : h("figure", { class: "scene", role: "img", "aria-label": sceneName + " animation for " + b.title, style: "margin:0" }, cv),
            biz ? null : cap, toc),
          page));
      view.replaceChildren(root);
      build(0);
      active = { next: () => show(idx + 1, 1), prev: () => show(idx - 1, -1) };
    }


    /* ---------- print & download ---------- */
    const bookText = b => "# " + b.title + "\n" + b.tag + "\n\n" + b.chapters.map((c, i) =>
      "## " + (i + 1) + ". " + c.title + "\n\n" + c.body.join("\n\n") + (c.fig ? "\n\n" + c.fig.k + ": " + c.fig.v : "")).join("\n\n") + "\n";
    function printBook(b) {
      let area = $("#print-area");
      if (!area) { area = h("div", { id: "print-area" }); document.body.append(area); }
      area.replaceChildren(
        h("h1", null, b.title), h("p", { class: "pa-tag" }, b.tag + " · " + b.chapters.length + " chapters"),
        ...b.chapters.map((c, i) => h("section", null, h("h2", null, (i + 1) + ". " + c.title), c.body.map(p => h("p", null, p)),
          c.fig ? h("p", { class: "pa-fact" }, h("strong", null, c.fig.k + ": "), c.fig.v) : null)));
      const clear = () => { area.replaceChildren(); removeEventListener("afterprint", clear); };
      addEventListener("afterprint", clear);
      window.print();
    }
    function downloadBook(b) {
      const esc = t => String(t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
      const doc = "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>" + esc(b.title) + "</title><style>" +
        "body{max-width:42rem;margin:0 auto;padding:2rem 1.2rem;font:18px/1.65 Georgia,serif;color:#11161C}h1{font:800 2rem/1.2 Helvetica,Arial,sans-serif}h2{font:700 1.3rem/1.3 Helvetica,Arial,sans-serif;margin-top:2.2rem}" +
        ".tag{font:.8rem monospace;letter-spacing:.1em;text-transform:uppercase;color:#555}.fact{border-left:4px solid " + esc(b.accent) + ";padding-left:.8rem;color:#333}</style></head><body><h1>" + esc(b.title) + "</h1><p class=\"tag\">" + esc(b.tag) + "</p>" +
        b.chapters.map((c, i) => "<h2>" + (i + 1) + ". " + esc(c.title) + "</h2>" + c.body.map(p => "<p>" + esc(p) + "</p>").join("") + (c.fig ? "<p class=\"fact\"><strong>" + esc(c.fig.k) + ":</strong> " + esc(c.fig.v) + "</p>" : "")).join("") + "</body></html>";
      const save = (content, type, ext) => {
        const url = URL.createObjectURL(new Blob([content], { type }));
        const a = h("a", { href: url, download: (b.title.replace(/[^\w]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "ebook") + "." + ext });
        document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
      return { html: () => save(doc, "text/html", "html"), txt: () => save(bookText(b), "text/plain", "txt") };
    }

    function parseBook(text) {
      const chs = []; let cur = null;
      const flush = c => { if (c.buf.length) { c.paras.push(c.buf.join(" ")); c.buf = []; } };
      for (const line of text.split("\n")) {
        const mm = line.match(/^##\s+(.+)/);
        if (mm) { if (cur) flush(cur); cur = { title: mm[1].trim().slice(0, 80), paras: [], buf: [] }; chs.push(cur); continue; }
        if (!cur) { if (!line.trim()) continue; cur = { title: "Chapter 1", paras: [], buf: [] }; chs.push(cur); }
        if (line.trim()) cur.buf.push(line.trim()); else flush(cur);
      }
      if (cur) flush(cur);
      return chs.filter(c => c.paras.length).slice(0, 12).map(c => ({ title: c.title, body: c.paras, fig: null, cap: null }));
    }

    function composer() {
      let scene = "water";
      const cv = h("canvas", { "aria-hidden": "true" });
      const stage = new Stage(cv, scene, 0);
      const err = h("p", { class: "err", role: "alert", hidden: true });
      const title = h("input", { type: "text", id: "book-title", maxlength: "60", value: "How bread works", autocomplete: "off" });
      const text = h("textarea", { id: "book-text" },
        "## Why dough rises\nYeast eats the sugars in dough and gives off carbon dioxide. The gas gets trapped in a stretchy network of gluten, so the dough swells.\n\n## What the oven does\nHeat makes the trapped gas expand, then the yeast dies and the structure sets. The crust browns through the Maillard reaction, which is why baked bread smells so different from raw dough.");
      const picker = h("div", { class: "picker", role: "radiogroup", "aria-label": "Animation" }, SCENE_LIST.map(([key, name]) =>
        h("label", { class: "opt" }, h("input", { type: "radio", name: "scene", id: "scene-" + key, value: key, checked: key === scene, onchange: () => { scene = key; stage.setScene(key); } }), h("span", null, name))));
      const form = h("form", {
        class: "compose", novalidate: true, onsubmit: e => {
          e.preventDefault();
          const t = title.value.trim(), chapters = parseBook(text.value);
          if (!t) { err.textContent = "Give your book a title."; err.hidden = false; title.focus(); return; }
          if (!chapters.length) { err.textContent = "Add some text. Start a chapter with a line like ## Chapter title."; err.hidden = false; text.focus(); return; }
          const info = SCENE_LIST.find(s => s[0] === scene);
          const book = {
            id: "my-" + Math.random().toString(36).slice(2, 8), custom: true, scene, title: t, tag: "Your book", accent: info[2],
            chapters: chapters.map(c => ({ ...c, cap: info[1] }))
          };
          store.custom.push(book); save(); location.hash = book.id;
        }
      },
        h("div", null, h("p", { class: "eyebrow", style: "margin-bottom:12px" }, "New book"), h("h1", null, "Write your own")),
        h("figure", { class: "scene", style: "margin:0;aspect-ratio:16/7" }, cv),
        h("div", { class: "field" }, h("label", { for: "book-title" }, "Title"), title),
        h("fieldset", { class: "field" }, h("legend", null, "Animation"), picker),
        h("div", { class: "field" }, h("label", { for: "book-text" }, "Chapters"), text,
          h("p", { class: "hint" }, "Start each chapter with ## and a title. Leave a blank line between paragraphs. The animation shifts through its three states as you turn chapters. This is an example you can replace.")),
        err,
        h("div", { class: "row" }, h("button", { class: "btn primary", type: "submit" }, "Add to library"), h("a", { class: "btn", href: "#" }, "Cancel")),
        h("p", { class: "hint" }, "Saved in this browser only."));
      view.replaceChildren(form);
    }

    function route() {
      cleanup();
      const id = location.hash.slice(1);
      if (id === "new-book") composer();
      else {
        const b = id && all().find(x => x.id === id);
        if (b) reader(b); else library();
      }
      window.scrollTo(0, 0);
    }
    addEventListener("hashchange", route);
    document.addEventListener("keydown", e => {
      if (!active || e.target.closest("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "ArrowRight") active.next();
      else if (e.key === "ArrowLeft") active.prev();
    });
    route();
  </script>

</body>
